<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ColorBeaconTimer</title>
  <link rel="stylesheet" href="app.css">
</head>

  <div id="app">
    <canvas id="stage" width="480" height="720"></canvas>
    <div id="beacon"></div>

    <img id="earth" alt="" src="assets/images/earth.jpg">
  </div>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
